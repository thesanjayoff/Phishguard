[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "0.1.0"
description = "Personal, local-first phishing detector for email, SMS and pasted messages"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "tldextract>=5.1",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
gmail = ["google-auth>=2.29", "google-auth-oauthlib>=1.2"]
outlook = ["msal>=1.28"]
llm = ["anthropic>=1.0"]
# Libraries used by the attachment worker. At runtime they live ONLY inside the
# isolated container image; they are listed here so the worker's unit tests can
# run on harmless, self-made fixtures.
worker = ["oletools>=0.60", "pefile>=2023.2", "capstone>=5.0", "olefile>=0.47"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
phishguard = "phishguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phishguard = ["data/*.json", "data/*.txt", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: needs internet (deselected by default)", "corpus: needs downloaded corpora"]
